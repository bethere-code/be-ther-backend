# Be Ther — production Nginx
#
# Critical for WhatsApp / iMessage previews:
# share links are https://be-ther.com/e/:postId and MUST hit the Fastify
# share route (Open Graph HTML), NOT the bolt marketing SPA.
#
# Verify after reload:
#   curl -s https://be-ther.com/e/<postId> | grep og:title
#   # should show the event title, not "Be Ther — A social calendar..."
#
# Backend listens on 127.0.0.1:3000 (docker compose).
# Marketing site root: adjust `root` to your deployed bolt/static path.

upstream be_ther_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name be-ther.com www.be-ther.com;

    # Certbot will replace this with HTTPS; keep the same location blocks.

    # App Links / Universal Links (Android + iOS)
    location /.well-known/ {
        proxy_pass http://be_ther_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Event share pages — Open Graph for WhatsApp, deep-link landing HTML
    location /e/ {
        proxy_pass http://be_ther_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # API (+ share route also reachable as /api/e/:id via strip)
    location /api/ {
        proxy_pass http://be_ther_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 12m;
    }

    # Marketing / landing site (bolt static export)
    # IMPORTANT: do not use a catch-all that steals /e/ above.
    root /var/www/be-ther;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
